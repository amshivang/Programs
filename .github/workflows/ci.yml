name: Coursework Code Quality & Compilation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint-python:
    name: Verify Python Syntax & Main Imports
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile and Validate Python Files
        run: |
          find "Python Programs" -name "*.py" -exec python -m py_compile {} +
          PYTHONPATH="Python Programs" python -c "import main, analyze_number, analyze_numbers, student_result, employee_salary, second_largest, circle_area, rectangle_area"

  verify-c-cpp:
    name: Verify C, C++ & DSA Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile C Programs
        run: |
          for f in "C Programs"/*.c; do
            if [ -f "$f" ]; then
              gcc -std=c11 -Wall -Wextra -Werror "$f" -lm -o /tmp/c_prog || exit 1
            fi
          done

      - name: Compile C++ Programs
        run: |
          for f in "C++ Programs"/*.cpp; do
            if [ -f "$f" ]; then
              g++ -std=c++17 -Wall -Wextra "$f" -o /tmp/cpp_prog || exit 1
            fi
          done
          for f in "C++ Programs"/*.c++; do
            if [ -f "$f" ]; then
              g++ -x c++ -std=c++17 -Wall -Wextra "$f" -o /tmp/cpp_ext_prog || exit 1
            fi
          done

      - name: Compile DSA Programs
        run: |
          for f in DSA/*.cpp; do
            if [ -f "$f" ]; then
              g++ -std=c++17 -Wall -Wextra -Wpedantic "$f" -o /tmp/dsa_prog || exit 1
            fi
          done

  verify-java:
    name: Verify Java Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compile Java Programs
        run: |
          mkdir -p /tmp/java-build
          javac -Xlint:all -d /tmp/java-build "Java Programs"/*.java
